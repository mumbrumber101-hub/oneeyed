:root { --teal:#264653; --red:#b22222; --grey:#5f6d73; --ink:#1f2a2e; }
* { box-sizing: border-box; }
html, body { margin:0; background:#fff; color:var(--ink); }
body { font-family:'EB Garamond', Garamond, 'Times New Roman', serif; font-size:17px; line-height:1.4; }
.wrap { max-width:1180px; margin:0 auto; padding:18px 16px 40px; }
header { display:flex; align-items:baseline; justify-content:space-between; border-bottom:1.5px solid var(--teal); padding-bottom:6px; }
h1 { font-weight:normal; color:var(--teal); font-size:30px; margin:0; letter-spacing:.01em; }
#counter { color:var(--grey); font-size:15px; font-variant-caps:small-caps; letter-spacing:.04em; }
.spine { display:flex; flex-wrap:wrap; gap:14px 26px; margin:14px 0 10px; }
.mvh { font-variant-caps:small-caps; letter-spacing:.05em; color:var(--grey); font-size:14px; margin-bottom:5px; white-space:nowrap; }
.discs { display:flex; gap:6px; }

(function(){
const BEATS = [{"n": 1, "head": "Glob into the Hole", "mv": "Principality and Nation", "html": "<p class=\"q\">“But now Big Toby was teasing an invisible glob of activated molecular syndrome into a microscopic hole drilled into the lead-shot part of a rifle bullet. He used a complicated microscope with a variety of eye-pieces impinging on his eyes; and he fingered a keyboard that created and controlled finger-shaped electrical fields to nudge the small glob into the hole and settle it there.”</p><p class=\"q\">“Principality and Nation, in you go!” Big Toby spoke to the little glob that was quite a few orders below bare-eye visibility. “Your history and your destiny begin right now. This is the first instant of your Heroic Age. Be Heroic then, which is the same thing as being inventive.”</p>", "stage": {"toby": "bench", "rifle": null, "inset": "hole", "bird": "singing", "bullet": null, "rails": [-1, -1]}, "dagger": false, "inset_label": ""}, {"n": 2, "head": "Bullet Chambered", "mv": "Principality and Nation", "html": "<p class=\"q\">“Tobias Lamb had now scaled the sub-microscopic ‘realm’ into the rifle bullet and had put the bullet into the chamber of the rifle.”</p><p class=\"note\">Toby tells the legend of the Cainite space-ark while he loads and chambers the bullet: the take-off and the voyage before the chambering, the date of the return after it. The lower rail carries that legend and lights as the flight runs.</p>", "stage": {"toby": "standing", "rifle": "low", "inset": "chamber", "bird": "singing", "bullet": "chamber", "rails": [-1, -1]}, "dagger": false, "inset_label": ""}, {"n": 3, "head": "Rifle Raised", "mv": "Shoulder and Eye", "html": "<p class=\"q\"><span class=\"act\">Then Tobias Lamb raised the rifle to shoulder and eye,</span><span> slid off the safety, sighted with the gun,</span><span> and crooked his finger around the trigger.</span></p>", "stage": {"toby": "raised", "rifle": "raised", "inset": "chamber", "bird": "singing", "bullet": "chamber", "sight": false, "rails": [-1, -1]}, "dagger": false, "inset_label": ""}, {"n": 4, "head": "Safety Off, Sighted", "mv": "Shoulder and Eye", "html": "<p class=\"q\"><span>Then Tobias Lamb raised the rifle to shoulder and eye,</span><span class=\"act\"> slid off the safety, sighted with the gun,</span><span> and crooked his finger around the trigger.</span></p><p class=\"q\"><span class=\"lead\">Toby, earlier, answering Francie’s “What in the world for?”</span> “I will really be shooting at that mocking-bird singing so imperfectly on that bough. But whether I miss or hit the bird, the rifle bullet will still crash into that rock cliff four kilometers across the valley, and it will destroy itself and the small nation that I will have put inside it.”</p>", "stage": {"toby": "raised", "rifle": "raised", "inset": "chamber", "bird": "singing", "bullet": "chamber", "sight": true, "rails": [-1, -1]}, "dagger": false, "inset_label": ""}, {"n": 5, "head": "Finger on the Trigger", "mv": "Shoulder and Eye", "html": "<p class=\"q\"><span>Then Tobias Lamb raised the rifle to shoulder and eye,</span><span> slid off the safety, sighted with the gun,</span><span class=\"act\"> and crooked his finger around the trigger.</span></p><p class=\"q\">“What are you really going to do, Toby?” Francie Jack asked with apprehension in her voice. “You’re acting very strange, even for you. You’re up to something, Toby. You’re up to something tricky!”</p>", "stage": {"toby": "raised", "rifle": "raised", "inset": "chamber", "bird": "singing", "bullet": "chamber", "sight": true, "trigger": true, "triglabel": true, "rails": [-1, -1]}, "dagger": false, "inset_label": ""}, {"n": 6, "head": "Minor Thing, Main Thing", "mv": "Shoulder and Eye", "html": "<p class=\"q\"><span class=\"lead\">Toby</span> “The minor thing I’m going to do, on either the first or second fly-by, is plug that mockingbird that is too saccharine to mock. And the main thing I’m going to do is set a living realm in the position where it >form local governments</span><span>, </span><span class=\"act\">expand to a limited universal government</span><span>, </span><span>develop science and technology</span><span>, </span><span>form groups of empowered geniuses to apply that science and technology</span><span>, </span><span>learn to navigate the bullet</span><span>, </span><span>avoid destruction against the cliff</span><span>; and </span><span>return it here in quest of their origin</span><span>, all within two and a half seconds of time.</span>”</p><p class=\"q\">“I smell tyranny in the wee realm you’re establishing, Toby,” Alwin Garvie bantered.</p><p class=\"q\"><span class=\"lead\">Toby</span> “You smell right, hump-nosed man. The strong impetus of outright tyranny! There is nothing like it for a realm that is at the same time a space ship.”</p><p class=\"q\"><span class=\"lead\">Space-ark</span> “Oh, we had a better start than they have, but we may not have had as good an inclination and indoctrination. We already had a city established on Earth, no mean city; so we had come a respectable ways in corporate organization. We had metallurgy. We had been working bronze and iron for a full generation.”</p>", "stage": {"toby": "raised", "rifle": "raised", "bird": "singing", "sight": false, "trigger": true, "inset": "program", "bullet": ["out", 0.45], "flyby": 1, "rails": [3, 1], "crew": true}, "dagger": false, "inset_label": "universal government"}, {"n": 11, "head": "Science and Technology", "mv": "Two and a Half Seconds", "html": "<p class=\"q\">“<span>It will do this unless the individuals of that nation shall </span><span>wake to consciousness</span><span>, </span><span>form local governments</span><span>, </span><span>expand to a limited universal government</span><span>, </span><span class=\"act\">develop science and technology</span><span>, </span><span>form groups of empowered geniuses to apply that science and technology</span><span>, </span><span>learn to navigate the bullet</span><span>, </span><span>avoid destruction against the cliff</span><span>; and </span><span>return it here in quest of their origin</span><span>, all within two and a half seconds of time.</span>”</p><p class=\"q\"><span class=\"lead\">Space-ark</span> “to develop a propulsion power from nothing while traveling at something more than escape velocity in cramped quarters in the dark.”</p>", "stage": {"toby": "raised", "rifle": "raised", "bird": "singing", "sight": false, "trigger": true, "inset": "program", "bullet": ["out", 0.6], "flyby": 1, "rails": [4, 2], "crew": true}, "dagger": false, "inset_label": "science and technology"}, {"n": 12, "head": "Empowered Geniuses", "mv": "Two and a Half Seconds", "html": "<p class=\"q\">“<span>It will do this unless the individuals of that nation shall </span><span>wake to consciousness</span><span>, </span><span>form local governments</span><span>, </span><span>expand to a limited universal government</span><span>, </span><span>develop science and technology</span><span>, </span><span class=\"act\">form groups of empowered geniuses to apply that science and technology</span><span>, </span><span>learn to navigate the bullet</span><span>, </span><span>avoid destruction against the cliff</span><span>; and </span><span>return it here in quest of their origin</span><span>, all within two and a half seconds of time.</span>”</p><p class=\"q\"><span class=\"lead\">Space-ark</span> “We had to develop from less than nothing a purpose and a philosophy.”</p><p class=\"q\"><span class=\"lead\">Space-ark</span> “We were the only early inventors, you know. Genesis 4:20-22 gives only the barest hints of our inventions, but they were the only human inventions in their time.”</p>", "stage": {"toby": "raised", "rifle": "raised", "bird": "singing", "sight": false, "trigger": true, "inset": "program", "bullet": ["out", 0.75], "flyby": 1, "rails": [5, 3], "crew": true}, "dagger": false, "inset_label": "empowered geniuses"}, {"n": 13, "head": "Navigate the Bullet", "mv": "Two and a Half Seconds", "html": "<p class=\"q\">“<span>It will do this unless the individuals of that nation shall </span><span>wake to consciousness</span><span>, </span><span>form local governments</span><span>, </span><span>expand to a limited universal government</span><span>, </span><span>develop science and technology</span><span>, </span><span>form groups of empowered geniuses to apply that science and technology</span><span>, </span><span class=\"act\">learn to navigate the bullet</span><span>, </span><span>avoid destruction against the cliff</span><span>; and </span><span>return it here in quest of their origin</span><span>, all within two and a half seconds of time.</span>”</p><p class=\"q\"><span class=\"lead\">Space-ark</span> “and a navigation to return to earth.”</p><p class=\"q\"><span class=\"lead\">Toby, equating the two spans of time</span> “Yes, our eight thousand years was a very close equivalent to their two and a half seconds, if in fact they do learn to navigate in time to bring the bullet back at all.”</p>", "stage": {"toby": "raised", "rifle": "raised", "bird": "singing", "sight": false, "trigger": true, "inset": "program", "bullet": ["out", 0.92], "flyby": 1, "rails": [6, 4], "crew": true}, "dagger": false, "inset_label": "navigate the bullet"}, {"n": 14, "head": "Avoid the Cliff", "mv": "Two and a Half Seconds", "html": "<p class=\"q\">“<span>It will do this unless the individuals of that nation shall </span><span>wake to consciousness</span><span>, </span><span>form local governments</span><span>, </span><span>expand to a limited universal government</span><span>, </span><span>develop science and technology</span><span>, </span><span>form groups of empowered geniuses to apply that science and technology</span><span>, </span><span>learn to navigate the bullet</span><span>, </span><span class=\"act\">avoid destruction against the cliff</span><span>; and </span><span>return it here in quest of their origin</span><span>, all within two and a half seconds of time.</span>”</p><p class=\"q\"><span class=\"lead\">Toby, on the scale of the two flights</span> “There is the order of size to be considered, direct cubical relations, inverse squares, angular velocity, and the relationship of tight-turning to elapsed time and to the pace of technology development.”</p><p class=\"note\">The turn is drawn dashed. The text gives the return, not the turn.</p>", "stage": {"toby": "raised", "rifle": "raised", "bird": "singing", "sight": false, "trigger": true, "inset": "program", "bullet": ["turn", 1.0], "flyby": 1, "rails": [7, 4], "crew": true}, "dagger": false, "inset_label": "avoid the cliff"}, {"n": 15, "head": "Second Fly-By", "mv": "Two and a Half Seconds", "html": "<p class=\"q\">“<span>It will do this unless the individuals of that nation shall </span><span>wake to consciousness</span><span>, </span><span>form local governments</span><span>, </span><span>expand to a limited universal government</span><span>, </span><span>develop science and technology</span><span>, </span><span>form groups of empowered geniuses to apply that science and technology</span><span>, </span><span>learn to navigate the bullet</span><span>, </span><span>avoid destruction against the cliff</span><span>; and </span><span class=\"act\">return it here in quest of their origin</span><span>, all within two and a half seconds of time.</span>”</p><p class=\"q\"><span class=\"lead\">Space-ark</span> “to soft-land on earth. That latter was very difficult for us, as it will be for what Alwin calls the ‘wee realm’ that I am putting into this rifle bullet here. Had the thing been done by any other than my own family I would call the whole thing impossible.”</p><p class=\"note\">Second pass at the bough, coming back.</p>", "stage": {"toby": "raised", "rifle": "raised", "bird": "singing", "sight": false, "trigger": true, "inset": "program", "bullet": ["ret", "bough"], "flyby": 2, "rails": [8, 5], "crew": true}, "dagger": false, "inset_label": "return in quest of origin"}, {"n": 16, "head": "Rifle Shoots Tobias Lamb", "mv": "Two and a Half Seconds", "html": "<p class=\"q\">“Tobias Lamb shot the rifle then. And, after an interval that seemed about two and a half or three seconds, the rifle shot Tobias Lamb. It shot him in the right eye and clear through his head. It killed him too.”</p><p class=\"note\">The dagger stands on this beat as ruled. Toby later refuses to call the death an illusion and places it as “a valid event in unelapsed time.”</p>", "stage": {"toby": "dead", "rifle": "raised", "bird": "singing", "trigger": true, "inset": null, "bullet": ["ret", 1.0], "flyby": 2, "rails": [9, 5], "crew": true, "eye": "shot", "dagger": true}, "dagger": true, "inset_label": ""}, {"n": 17, "head": "Cataleptic Rigidity", "mv": "Dead Standing Up", "html": "<p class=\"q\">“Tobias Lamb was dead standing up. He was so stocky and solid that he did not fall. He did not even lower the rifle. He was in a cataleptic rigidity. He had no breath and heartbeat. The shot had entered his right eye and had exited massively from the back of his head.”</p><p class=\"q\">“He still had his big grin, more grotesque than ever, almost more life-like than ever.”</p>", "stage": {"toby": "dead", "rifle": "raised", "trigger": true, "inset": null, "bullet": ["ret", 1.0], "flyby": 2, "rails": [9, 5], "crew": true, "eye": "shot", "dagger": true, "bird": "singing"}, "dagger": false, "inset_label": ""}, {"n": 18, "head": "Out of Time", "mv": "Dead Standing Up", "html": "<p class=\"q\"><span class=\"lead\">Francie Jack, as if in a daze</span> “This is not real, this is not real. This is something happening out of time.”</p><p class=\"q\">“What is that misfit bird-song?” Alwin Garvie asked in inconsequential amazement. “The mockery of it, the arrogance of it! That part, at least, is real.”</p><p class=\"q\">“The coroner will decide what is real,” Paul Kradzesh stated heavily. “And here he is now. I never saw a call answered so fast. It’s almost impossible.”</p>", "stage": {"toby": "dead", "rifle": "raised", "trigger": true, "inset": null, "bullet": ["ret", 1.0], "flyby": 2, "rails": [9, 5], "crew": true, "eye": "shot", "dagger": true, "bird": "misfit", "coroner": "present"}, "dagger": false, "inset_label": ""}, {"n": 19, "head": "Burlesque Routine", "mv": "Dead Standing Up", "html": "<p class=\"q\">“The coroner was busying himself about the standing dead man, going through what seemed like a burlesque routine.”</p><p class=\"q\">“Oh, he is rigid in death,” the coroner said then. “He’s dead standing up, and he rigidified so swiftly and he is so well balanced that he did not fall. Ah, he still has his finger on the gun trigger. Don’t stand in front of it. It’s a rare happening, and yet I’ve seen it twice before in my practice.”</p>", "stage": {"toby": "dead", "rifle": "raised", "trigger": true, "inset": null, "bullet": ["ret", 1.0], "flyby": 2, "rails": [9, 5], "crew": true, "eye": "shot", "dagger": true, "bird": "misfit", "coroner": "busy"}, "dagger": false, "inset_label": ""}, {"n": 20, "head": "You Lie", "mv": "Unelapsed Time", "html": "<p class=\"q\">“You lie,” said dead man Tobias Lamb in a pleasanter voice than usual. “Such a thing never happened before. It didn’t happen this time either. Oh, don’t look so angry and repelled, good friends. Did you want me dead? You really don’t understand the possibilities and paradoxes that are present in the context of ‘unelapsed time’? It’s a property of very small realms and societies. It’s a bonus that almost dwarfs the rest of it. Oh, how howlingly valuable it will be to us!”</p>", "stage": {"toby": "dead", "rifle": "raised", "trigger": true, "inset": null, "bullet": ["ret", 1.0], "flyby": 2, "rails": [9, 5], "crew": true, "eye": "shot", "dagger": true, "bird": "misfit", "coroner": "present", "speaking": true}, "dagger": false, "inset_label": ""}, {"n": 21, "head": "Not Here Now", "mv": "Unelapsed Time", "html": "<p class=\"q\">“We do not like you, Tobias!” Paul Kradzesh swore savagely. “We do not like you because of tricks like this. But it did happen! And the coroner was here.”</p><p class=\"q\">“And he is not here now,” Toby Lamb laughed. “You cannot say properly ‘He was here’ because there are no tenses in unelapsed time. Nor will I assure you that my death is an illusion. It is a valid event in unelapsed time, that first remarkable fall-out of the miniature space flight and return.”</p>", "stage": {"toby": "dead", "rifle": "raised", "trigger": true, "inset": null, "bullet": ["ret", 1.0], "flyby": 2, "rails": [9, 5], "crew": true, "eye": "shot", "dagger": true, "bird": "misfit", "coroner": "gone", "speaking": true}, "dagger": false, "inset_label": ""}, {"n": 22, "head": "Shiner", "mv": "Unelapsed Time", "html": "<p class=\"q\"><span class=\"lead\">Toby</span> “No, of course I’m not all right, Francie. I have a shiner. The soft landing of the returning bullet-space-ship was not all that soft. It blacked my eye.”</p><p class=\"note\">The rifle is drawn lowered from this beat on. The text does not say when he lowered it.</p>", "stage": {"toby": "shiner", "rifle": "low", "trigger": false, "inset": null, "bullet": ["ret", 1.0], "flyby": 2, "rails": [9, 5], "crew": true, "eye": "shiner", "dagger": false, "coroner": null, "speaking": true, "bird": "misfit"}, "dagger": false, "inset_label": ""}, {"n": 23, "head": "One-Eyed Bird", "mv": "Unelapsed Time", "html": "<p class=\"q\">“The mocking-bird, still singing on its branch outside, had lost an eye to the fly-by either coming or going. But it had a new song that you had to respect whether you liked it or not.”</p><p class=\"q\">“I hate you, Toby,” Paul said tightly. “Why did you do such a thing as that?”</p><p class=\"q\"><span class=\"lead\">Toby</span> “For the joy of discovery, for dramatic affect, for open fun, and to perform a valid experiment. Ah, that bird-song! It’s near perfect now! The inimitable mockery and arrogance of it! And the burning belief! A little discipline in its life was all that bird needed. Aye, get that glob of irony in its song! Mock, bird, mock! And believe at the same time. A one-eyed bird had better be a true believer around here!”</p>", "stage": {"toby": "shiner", "rifle": "low", "trigger": false, "inset": null, "bullet": ["ret", 1.0], "flyby": 3, "rails": [9, 5], "crew": true, "eye": "shiner", "dagger": false, "coroner": null, "speaking": true, "bird": "oneeyed"}, "dagger": false, "inset_label": ""}, {"n": 24, "head": "Atomic-Speed Invention", "mv": "Unelapsed Time", "html": "<p class=\"q\">“The reactive jelly, as you so ignorantly call it, will react astonishingly now,” Big Toby said. “It has become a nation of consummate atomic-speed invention. Set it any problem and it will solve it. The ramifications of all this, they are endless.”</p><p class=\"q\"><span class=\"lead\">Toby</span> “Oh sure, oh sure. Whether the little nation did those space marvels or not, it is absolutely essential that it believes it did them. Its motivation lies in its high history.”</p><p class=\"q\"><span class=\"lead\">Space-ark, asked when it returned</span> “I don’t know. Within the last several hundred years. When invention returned to the Earth, that was the space-ark homing back.”</p>", "stage": {"toby": "shiner", "rifle": "low", "trigger": false, "inset": "nation", "bullet": ["ret", 1.0], "flyby": 3, "rails": [9, 6], "crew": true, "eye": "shiner", "dagger": false, "coroner": null, "speaking": true, "bird": "oneeyed"}, "dagger": false, "inset_label": ""}, {"n": 25, "head": "Token and Mascot", "mv": "Unelapsed Time", "html": "<p class=\"q\">“Some day, today, almost immediately,” Tobias Lamb gloated. “Oh, the most promising students for it can be selected with no time elapsed at all. I’ve already put a realm to work on that, and the selection is already waiting for me.”</p><p class=\"q\">“Those brilliant, odd-lot students have their own cultus and fraternity now, and their token and mascot is the One-Eyed Mocking-Bird.”</p>", "stage": {"toby": "shiner", "rifle": "low", "trigger": false, "inset": null, "bullet": ["ret", 1.0], "flyby": 3, "rails": [9, 6], "crew": true, "eye": "shiner", "dagger": false, "coroner": null, "speaking": true, "bird": "token", "fade": true}, "dagger": false, "inset_label": ""}];
const N = BEATS.length;
const $ = id => document.getElementById(id);
const show = (el, on) => { if (el) el.style.display = on ? '' : 'none'; };
let cur = 0;           // index 0..N-1

// flight geometry
const pOut = $('p-out'), pTurn = $('p-turn'), pRet = $('p-ret');
const rOut = $('r-out'), rTurn = $('r-turn'), rRet = $('r-ret');
const L1 = pOut.getTotalLength(), L2 = pTurn.getTotalLength(), L3 = pRet.getTotalLength();
const LT = L1 + L2 + L3;
const BOUGH_X = 432.0;
// arc length on the return leg at the bough crossing
let sComing = 0;
(function(){ let best = 1e9; for (let s = 0; s <= L3; s += 0.5) { const p = pRet.getPointAtLength(s); const d = Math.abs(p.x - BOUGH_X); if (d < best) { best = d; sComing = s; } } })();
let sCur = 0;
let anim = null;

function pointAt(s){
  if (s <= L1) return pOut.getPointAtLength(s);
  if (s <= L1 + L2) return pTurn.getPointAtLength(s - L1);
  return pRet.getPointAtLength(Math.min(L3, s - L1 - L2));
}
function drawS(s){
  sCur = s;
  const p = pointAt(s);
  const b = $('bullet'); b.setAttribute('cx', p.x); b.setAttribute('cy', p.y);
  rOut.setAttribute('stroke-dasharray', Math.min(s, L1) + ' ' + (L1 + 10));
  show(rTurn, s >= L1 + L2 - 0.5);
  const r3 = Math.max(0, s - L1 - L2);
  rRet.setAttribute('stroke-dasharray', r3 + ' ' + (L3 + 10));
  show($('turnlabel'), s >= L1 + L2 - 0.5);
}
function targetS(st){
  const bl = st.bullet;
  if (!Array.isArray(bl)) return null;
  const [leg, f] = bl;
  if (leg === 'out') return L1 * f;
  if (leg === 'turn') return L1 + L2;
  if (leg === 'ret') return f === 'bough' ? L1 + L2 + sComing : L1 + L2 + L3 * f;
  return null;
}
function animateTo(s1, instant){
  if (anim) { cancelAnimationFrame(anim); anim = null; }
  if (instant || Math.abs(s1 - sCur) < 0.5) { drawS(s1); return; }
  const s0 = sCur, t0 = performance.now(), dur = 700;
  const step = now => {
    let t = Math.min(1, (now - t0) / dur);
    t = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    drawS(s0 + (s1 - s0) * t);
    if (t < 1) anim = requestAnimationFrame(step); else anim = null;
  };
  anim = requestAnimationFrame(step);
}

function setRail(prefix, idx, n){
  const x0 = 150, x1 = 1060;
  const prog = $(prefix + '-prog');
  for (let i = 0; i < n; i++) {
    const c = $(prefix + '-' + i), l = $(prefix + '-l' + i);
    const lit = i <= idx;
    c.setAttribute('fill', lit ? '#b22222' : '#fff');
    c.setAttribute('stroke', lit ? '#b22222' : '#264653');
    l.setAttribute('fill', i === idx ? '#b22222' : '#264653');
    l.style.fontStyle = i === idx ? 'italic' : 'normal';
  }
  if (idx < 0) { show(prog, false); return; }
  show(prog, true);
  const xs = parseFloat($(prefix + '-' + idx).getAttribute('cx'));
  prog.setAttribute('x2', xs);
}

function render(i, instant){
  cur = i;
  const b = BEATS[i], st = b.stage;
  // spine
  document.querySelectorAll('.disc').forEach(d => {
    const n = +d.dataset.n; d.classList.toggle('on', n === b.n);
  });
  $('counter').textContent = 'Beat ' + b.n + ' of ' + N;
  $('mv').textContent = b.mv;
  $('bh').textContent = b.head + (b.dagger ? ' †' : '');
  $('quotes').innerHTML = b.html;
  $('prev').disabled = i === 0; $('next').disabled = i === N - 1;
  // poses
  show($('toby-bench'), st.toby === 'bench');
  show($('toby-standing'), st.toby === 'standing' || st.toby === 'shiner');
  show($('toby-raised'), st.toby === 'raised' || st.toby === 'dead');
  show($('eyepieces'), st.toby === 'bench');
  document.querySelectorAll('#toby-standing .eye-normal').forEach(e => show(e, st.eye !== 'shiner'));
  document.querySelectorAll('#toby-standing .eye-shiner').forEach(e => show(e, st.eye === 'shiner'));
  document.querySelectorAll('#toby-raised .eye-normal').forEach(e => show(e, st.eye !== 'shot'));
  document.querySelectorAll('#toby-raised .eye-shot').forEach(e => show(e, st.eye === 'shot'));
  const el = $('eyelabel');
  if (st.eye === 'shot') { el.textContent = 'right eye'; show(el, true); }
  else if (st.eye === 'shiner') { el.textContent = 'shiner'; show(el, true); }
  else show(el, false);
  show($('dagger'), !!st.dagger);
  show($('sight'), !!st.sight);
  show($('triglabel'), !!st.triglabel);
  show($('targets'), !!st.targets);
  show($('flash'), !!st.flash);
  show($('chamber-dot'), st.bullet === 'chamber' && st.toby === 'raised');
  // inset
  const ins = st.inset;
  show($('inset'), !!ins);
  show($('inset-arrow'), ins === 'hole');
  show($('inset-glob'), ins === 'hole' || ins === 'chamber' || ins === 'program' || ins === 'nation');
  const ip = $('inset-prog');
  ip.textContent = '';
  if (ins === 'program' || ins === 'nation') {
    let lines;
    if (ins === 'nation') lines = ['nation of consummate', 'atomic-speed invention'];
    else { const words = b.inset_label.split(' '); lines = []; let line = '';
      words.forEach(w => { if ((line + ' ' + w).trim().length > 20 && line) { lines.push(line); line = w; } else line = (line + ' ' + w).trim(); });
      if (line) lines.push(line); }
    lines.forEach((ln, k) => { const t = document.createElementNS('http://www.w3.org/2000/svg', 'tspan'); t.setAttribute('x', 84); t.setAttribute('dy', k === 0 ? 0 : 12); t.textContent = ln; ip.appendChild(t); });
  } else if (ins === 'chamber') {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'tspan'); t.setAttribute('x', 84); t.textContent = 'in the chamber'; ip.appendChild(t);
  }
  // coroner
  const co = st.coroner;
  show($('coroner'), !!co);
  show($('coroner-busy'), co === 'busy');
  const cf = $('coroner-fig');
  cf.setAttribute('stroke-dasharray', co === 'gone' ? '4 3' : '');
  cf.setAttribute('fill', co === 'gone' ? '#fff' : '#7f8d93');
  const cl = $('coroner-label');
  if (co === 'gone') { cl.textContent = '“not here now”'; cl.setAttribute('fill', '#b22222'); cl.style.fontStyle = 'italic'; }
  else { cl.textContent = 'coroner'; cl.setAttribute('fill', '#5f6d73'); cl.style.fontStyle = 'normal'; }
  // bird
  const bird = st.bird;
  show($('bird-eye-x'), bird === 'oneeyed' || bird === 'token');
  show($('bird-eye'), !(bird === 'oneeyed' || bird === 'token'));
  show($('tokenlabel'), bird === 'token');
  const song = $('song');
  song.setAttribute('stroke', (bird === 'misfit' || bird === 'oneeyed' || bird === 'token') ? '#b22222' : '#264653');
  $('bird-body').setAttribute('fill', bird === 'token' ? '#b22222' : '#264653');
  $('bird-legs').setAttribute('stroke', bird === 'token' ? '#b22222' : '#264653');
  $('scene').classList.toggle('fade', !!st.fade);
  // flight
  const s1 = targetS(st);
  show($('flight'), s1 !== null);
  show($('fb1'), (st.flyby || 0) >= 1);
  show($('fb2'), (st.flyby || 0) >= 2);
  show($('fblabel'), (st.flyby || 0) >= 3);
  [$('fb1'), $('fb2')].forEach(c => c.setAttribute('stroke-width', (st.flyby || 0) >= 3 ? 2.2 : 1.5));
  if (s1 !== null) {
    const cameFromFlight = Array.isArray(BEATS[lastIdx].stage.bullet);
    const adjacent = Math.abs(i - lastIdx) === 1;
    animateTo(s1, !!instant || !(cameFromFlight && adjacent));
  } else { sCur = 0; }
  // rails
  setRail('rb', st.rails[0], 10);
  setRail('ra', st.rails[1], 7);
  const crew = $('crew'); crew.setAttribute('fill', st.crew ? '#b22222' : '#5f6d73');
  lastIdx = i;
  try { history.replaceState(null, '', '#b' + b.n); } catch(e) {}
}
let lastIdx = 0;

function go(d){ const j = Math.max(0, Math.min(N - 1, cur + d)); if (j !== cur) render(j); }
$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('stage').addEventListener('click', e => { if (e.shiftKey) go(-1); else go(1); });
document.querySelectorAll('.disc').forEach(d => d.addEventListener('click', () => render(+d.dataset.n - 1, true)));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
  else if (e.key === 'Home') { render(0, true); }
  else if (e.key === 'End') { render(N - 1, true); }
});
function fromHash(){ const m = (location.hash || '').match(/^#b(\d+)$/); if (m) { const n = +m[1]; if (n >= 1 && n <= N) return n - 1; } return 0; }
window.addEventListener('hashchange', () => { const j = fromHash(); if (j !== cur) render(j, true); });
render(fromHash(), true);
})();
</script>
